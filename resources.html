<!-- ========================================
   RESOURCES TREE
   ======================================== -->
<section class="resources-tree-section">
    <div id="resourcesTree"></div>
</section>

<!-- ========================================
   SCRIPTS
   ======================================== -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="js/main.js" defer></script>
<script src="js/theme.js" defer></script>
<script src="js/animations.js" defer></script>
<script src="js/tree-data.js" defer></script>
<script src="js/osint-tree.js" defer></script>
<script src="js/quiz.js" defer></script>

<script>
    // Initialize the tree when everything is loaded
    window.addEventListener('load', function() {
        setTimeout(function() {
            if (window.resourcesTreeData && window.OsintTree) {
                window.resourcesTree = new OsintTree('resourcesTree', window.resourcesTreeData);
                console.log('✅ Resources tree initialized!');
            }
        }, 100);
    });
</script>

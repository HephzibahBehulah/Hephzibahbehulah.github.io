name: Public ADIGUN AI Validation

on:
  push:
    branches: [main]
    paths:
      - "worker-public-v2.js"
      - "worker-platform.mjs"
      - "ai-agent.html"
      - "ai.html"
      - "js/ai-lab.js"
      - "js/adigun-agent.js"
      - "wrangler.jsonc"
      - ".github/workflows/public-ai-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-public-ai:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate public AI gateway
        run: |
          node --check worker-public-v2.js
          node --check worker-platform.mjs
          test -s ai-agent.html
          test -s ai.html
          test -s js/ai-lab.js
          test -s js/adigun-agent.js
          grep -q 'id="aiAdd"' ai-agent.html
          grep -q 'id="aiFile"' ai-agent.html
          grep -q 'id="aiPhoto"' ai-agent.html
          grep -q 'id="aiVideo"' ai-agent.html
          grep -q 'id="aiVoice"' ai-agent.html
          grep -q 'id="aiRecord"' ai-agent.html
          grep -q '/api/transcribe' worker-public-v2.js
          grep -q 'api.openai.com/v1/audio/transcriptions' worker-public-v2.js
          grep -q '"main": "worker-platform.mjs"' wrangler.jsonc

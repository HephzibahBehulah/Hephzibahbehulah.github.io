name: Public ADIGUN AI Validation

on:
  push:
    branches: [main]
    paths:
      - "backend/workers/worker-public-v2.js"
      - "backend/workers/worker-platform.mjs"
      - "apps/public/ai-agent.html"
      - "apps/public/ai.html"
      - "js/ai-lab.js"
      - "js/adigun-agent.js"
      - "wrangler.jsonc"
      - ".github/workflows/public-ai-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-public-ai:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate public AI gateway
        run: |
          node --check backend/workers/worker-public-v2.js
          node --check backend/workers/worker-platform.mjs
          test -s apps/public/ai-agent.html
          test -s apps/public/ai.html
          test -s js/ai-lab.js
          test -s js/adigun-agent.js
          grep -q 'id="aiAdd"' apps/public/ai-agent.html
          grep -q 'id="aiFile"' apps/public/ai-agent.html
          grep -q 'id="aiPhoto"' apps/public/ai-agent.html
          grep -q 'id="aiVideo"' apps/public/ai-agent.html
          grep -q 'id="aiVoice"' apps/public/ai-agent.html
          grep -q 'id="aiRecord"' apps/public/ai-agent.html
          grep -q '/api/transcribe' backend/workers/worker-public-v2.js
          grep -q 'api.openai.com/v1/audio/transcriptions' backend/workers/worker-public-v2.js
          grep -q '"main": "backend/workers/worker-platform.mjs"' wrangler.jsonc

name: Progressive Disclosure Validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check js/global-search.js
          node --check js/mega-tools.js
          node --check js/progressive-disclosure.js
          node --check cyber-os/cybersecurity-tools-academy.js
      - name: Check shared assets are wired to all target pages
        run: |
          grep -q "progressive-disclosure.css" apps/public/index.html
          grep -q "progressive-disclosure.css" apps/admin/admin-tools.html
          grep -q "progressive-disclosure.css" apps/cyber-os/index.html
          grep -q "progressive-disclosure.js" apps/public/index.html
          grep -q "progressive-disclosure.js" apps/admin/admin-tools.html
          grep -q "progressive-disclosure.js" apps/cyber-os/index.html

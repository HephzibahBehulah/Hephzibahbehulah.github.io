name: Integrated platform validation
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main", "codex/**"]
    tags: ["deploy-*"]
concurrency:
  group: integrated-platform-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/deploy-')) && 'production' || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    name: Platform release validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check integration JavaScript
        run: |
          node --check backend/workers/worker-platform.mjs
          node --check platform/platform.js
          node --check platform/experience.js
          node --check platform/account-page.js
          node --check platform/member.js
          node --check platform/build.mjs
          node --check platform/sitewide-theme.mjs
          node --check platform/router.mjs
          node --check platform/cyber-ai.mjs
          node --check platform/admin-accounts-ui.js
          node --check platform/admin-security-ui.js
          node --check platform/admin-security.mjs
          node --check packages/shared-i18n/language-system.js
      - name: Verify preservation of the original platform
        run: node platform/preflight.mjs
      - name: Check every original browser script
        run: node platform/check-browser-scripts.mjs
      - name: Build the self-contained release from consolidated source
        run: node platform/release.mjs

      - name: Record deployment timestamp
        if: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')) || startsWith(github.ref, 'refs/tags/deploy-') }}
        run: echo "DEPLOYMENT_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Install Cloudflare Worker deployment dependencies
        run: npm install --no-audit --no-fund

      - name: Build the pinned ADIGUN sandbox image
        run: docker build --tag adigun-private-sandbox:ci .

      - name: Dry-run integrated Worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-dry

      - name: Deploy integrated Worker and assets to Cloudflare
        if: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')) || startsWith(github.ref, 'refs/tags/deploy-') }}
        run: npx wrangler deploy --var "DEPLOYMENT_TIMESTAMP:${DEPLOYMENT_TIMESTAMP}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production release and retired engineering routes
        if: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')) || startsWith(github.ref, 'refs/tags/deploy-') }}
        run: node platform/verify-admin-deployment.mjs

      - name: Preserve the production security and upgrade report
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/deploy-')) }}
        uses: actions/upload-artifact@v7
        with:
          name: production-security-report
          path: work/production-security-report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Preserve verified platform catalogues for reproducible builds
        uses: actions/upload-artifact@v7
        with:
          name: verified-platform-catalogues
          path: cyber-os/data/
          if-no-files-found: error
          retention-days: 1

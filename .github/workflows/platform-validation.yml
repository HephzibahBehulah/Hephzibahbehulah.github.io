name: Integrated platform validation
on:
  pull_request:
  push:
    branches: ["main", "codex/**"]
    tags: ["deploy-*"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check integration JavaScript
        run: |
          node --check worker-platform.mjs
          node --check platform/platform.js
          node --check platform/experience.js
          node --check platform/account-page.js
          node --check platform/member.js
          node --check platform/studio.js
          node --check platform/studio-bank.js
          node --check platform/studio-search-worker.js
          node --check platform/studio-plc-bridge.js
          node --check platform/build.mjs
          node --check platform/engineering-ai.mjs
          node --check platform/cyber-ai.mjs
          node --check platform/admin-accounts-ui.js
          node --check js/language-system.js
      - name: Verify authorization, routing and tutor boundaries
        run: node --test platform/access.test.mjs platform/router.test.mjs platform/engineering-ai.test.mjs platform/app-archives.test.mjs platform/admin-accounts.test.mjs platform/public-auth.test.mjs platform/studio-bank.test.mjs platform/language-system.test.mjs platform/release-assets.test.mjs platform/about-contact.test.mjs
      - name: Verify preservation of the original platform
        run: node platform/preflight.mjs
      - name: Check every original browser script
        run: node platform/check-browser-scripts.mjs
      - name: Build the self-contained release from consolidated source
        run: node platform/release.mjs

      - name: Install Cloudflare Worker deployment dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy integrated Worker and assets to Cloudflare
        if: startsWith(github.ref, 'refs/tags/deploy-')
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy dedicated VoltPro engineering AI Worker
        if: startsWith(github.ref, 'refs/tags/deploy-')
        run: npx wrangler deploy --config apps/voltpro-engineering-source/server/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Preserve verified platform catalogues for reproducible builds
        uses: actions/upload-artifact@v4
        with:
          name: verified-platform-catalogues
          path: cyber-os/data/
          if-no-files-found: error
          retention-days: 1

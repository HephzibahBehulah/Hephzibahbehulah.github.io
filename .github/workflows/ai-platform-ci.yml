name: AI Platform CI

on:
  pull_request:
  push:
    branches: [main, ai-platform-foundation]

jobs:
  static-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Validate site search, AI browser JavaScript and Worker
        run: |
          node --version
          node --check public/js/global-search.js
          node --check public/js/ai-lab.js
          node --check public/js/adigun-agent.js
          node --check worker-v2.js
          node --check worker-openai.js
          node --check public/js/adigun-admin.js
          node --check public/js/adigun-renderer.js

      - name: Validate Python ML service
        run: |
          python --version
          python -m py_compile ml-service/app.py

      - name: Validate Cloudflare Sandbox execution plane
        run: |
          test -f package.json
          grep -q '"@cloudflare/sandbox": "0.12.10"' package.json
          grep -q 'class_name.*Sandbox' wrangler.jsonc
          grep -q 'durable_objects' wrangler.jsonc
          grep -q 'new_sqlite_classes' wrangler.jsonc
          grep -q '/api/admin/sandbox' worker-openai.js
          grep -q 'SANDBOX_COMMANDS' worker-openai.js
          grep -q 'sandbox.exec' worker-openai.js
          grep -q 'CloudflareSandbox' worker-openai.js

      - name: Validate secure execution lab
        run: |
          test -f .github/workflows/adigun-secure-execution.yml
          grep -q "permissions:" .github/workflows/adigun-secure-execution.yml
          grep -q "contents: read" .github/workflows/adigun-secure-execution.yml
          grep -q "Blocked: command is not allow-listed" .github/workflows/adigun-secure-execution.yml

      - name: Validate ADIGUN production surfaces
        run: |
          test -f worker-openai.js
          test -f public/js/adigun-agent.js
          test -f public/js/ai-lab.js
          test -f public/js/adigun-admin.js
          test -f public/js/adigun-renderer.js
          grep -q 'id="attachmentInput"' public/ai-lab.html
          grep -q 'id="adminMessages"' public/admin.html
          ! grep -q 'I do not have a local answer for that yet' public/js/ai-lab.js
          ! grep -q 'ADIGUN_AGENT_KEY' public/js/adigun-agent.js worker-openai.js

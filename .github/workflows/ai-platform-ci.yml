name: AI Platform CI

on:
  pull_request:
  push:
    branches: [main, ai-platform-foundation]

jobs:
  static-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Validate site search, AI browser JavaScript and Worker
        run: |
          node --version
          node --check js/global-search.js
          node --check js/ai-lab.js
          node --check js/adigun-agent.js
          node --check worker-v2.js
          node --check worker-openai.js
          grep -q 'api/transcribe' worker-openai.js
          grep -q 'audio/transcriptions' worker-openai.js
          node --check js/adigun-admin.js
          node --check js/adigun-private-operator.js
          node --check js/adigun-renderer.js

      - name: Validate ADIGUN Cyber OS
        run: |
          node --check cyber-os/cyber-os.js
          node --check cyber-os/knowledge-hub.js
          node --check cyber-os/knowledge-engine.js
          node --check scripts/sync-iana-ports.mjs
          node --check scripts/sync-mitre-attack.mjs
          node --check scripts/sync-microsoft-command-docs.mjs
          node --check scripts/sync-linux-manpages.mjs
          node --check scripts/sync-rfc-index.mjs
          node --check cyber-os/catalog-loader.js
          node --check cyber-os/encyclopedia-engine.js
          node -e "const d=JSON.parse(require('fs').readFileSync('cyber-os/data/generated/cybersecurity-tools.json','utf8')); if(!Array.isArray(d.records)||d.records.length!==d.count||!d.records.every(x=>x.name&&x.purpose&&x.safeUse&&/^https:/.test(x.sourceUrl))) process.exit(1)"
          node --check cyber-os/knowledge-graph-engine.js
          node --check cyber-os/knowledge-games.js
          node --check cyber-os/knowledge-games-ui.js
          node --check cyber-os/scale-status.js
          node --check cyber-os/cyber-os-graph.js
          node --check cyber-os/learning-engine.js
          node --check cyber-os/soc-simulator.js
          node --check cyber-os/cyber-os-data.js
          node --check cyber-os/source-registry.js
          node -e "JSON.parse(require('fs').readFileSync('cyber-os/content-schema.json','utf8'))
          JSON.parse(require('fs').readFileSync('cyber-os/data/catalog-manifest.json','utf8'))
          JSON.parse(require('fs').readFileSync('cyber-os/data/source-manifest.json','utf8'))
          JSON.parse(require('fs').readFileSync('cyber-os/data/relationships.json','utf8'))"
          test -f cyber-os/index.html
          test -f cyber-os/cyber-os.css
          test -f cyber-os/PHASES.md
          test -f cyber-os/data/README.md

      - name: Validate Python ML service
        run: |
          python --version
          python -m py_compile ml-service/app.py

      - name: Validate Cloudflare Sandbox execution plane
        run: |
          test -f package.json
          grep -q '"@cloudflare/sandbox": "0.12.10"' package.json
          grep -q 'class_name.*Sandbox' wrangler.jsonc
          grep -q 'durable_objects' wrangler.jsonc
          grep -q 'new_sqlite_classes' wrangler.jsonc
          grep -q '/api/admin/sandbox' worker-openai.js
          grep -q 'SANDBOX_COMMANDS' worker-openai.js
          grep -q 'sandbox.exec' worker-openai.js
          grep -q 'CloudflareSandbox' worker-openai.js

      - name: Validate secure execution lab
        run: |
          test -f .github/workflows/adigun-secure-execution.yml
          grep -q "permissions:" .github/workflows/adigun-secure-execution.yml
          grep -q "contents: read" .github/workflows/adigun-secure-execution.yml
          grep -q "Blocked: command is not allow-listed" .github/workflows/adigun-secure-execution.yml

      - name: Validate ADIGUN production surfaces
        run: |
          test -f worker-openai.js
          test -f js/adigun-agent.js
          test -f js/ai-lab.js
          test -f js/adigun-admin.js
          test -f js/adigun-renderer.js
          test -f ai-agent.html
          test -f css/mobile-system.css
          test -f js/language-system.js
          test -f data/translations/en.json
          test -f data/translations/de.json
          test -f data/translations/yo.json
          test -f data/translations/pid.json
          grep -q 'id="adminMessages"' admin.html
          grep -q 'language-system.js' index.html
          grep -q 'mobile-system.css' index.html
          ! grep -q 'I do not have a local answer for that yet' js/ai-lab.js
          ! grep -q 'ADIGUN_AGENT_KEY' js/adigun-agent.js worker-openai.js

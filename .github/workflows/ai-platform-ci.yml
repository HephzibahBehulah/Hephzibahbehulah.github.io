name: AI Platform CI

on:
  pull_request:
  push:
    branches: [main, ai-platform-foundation]

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser JavaScript
        run: |
          node --check js/ai-lab.js
          node --check worker.js
      - name: Validate Python ML service
        run: python -m py_compile ml-service/app.py

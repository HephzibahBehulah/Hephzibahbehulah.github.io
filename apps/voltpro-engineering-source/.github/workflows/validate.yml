name: VoltPRo Quality Check
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check script.js
          node --check simulator.js
          node --check engineering.js
          node --check voltpro-assistant.js
          node --check engine/voltpro-engine.js
          node -e "const x=JSON.parse(require('fs').readFileSync('pwa.webmanifest','utf8')); if(!x.name||!x.start_url) process.exit(1)"
      - name: Validate required frontend files
        run: |
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s simulator.html
          test -s simulator.css
          test -s simulator.js
          test -s engineering.html
          test -s engineering.css
          test -s engineering.js
          test -s voltpro-assistant.js
          test -s voltpro-hb-theme.css
          test -s voltpro-identity.css
          test -s assets/hb-logo.svg
          test -s pwa.webmanifest
          test -s service-worker.js
          grep -q 'simulator.js' simulator.html
          grep -q 'simulator.css' simulator.html
          grep -q 'voltpro-engine.js' simulator.html
          grep -q 'voltpro-hb-theme.css' index.html
          grep -q 'voltpro-identity.css' index.html
          grep -q 'hb-identity-node' index.html
          grep -q 'assets/hb-logo.svg' index.html
          grep -q 'voltpro-assistant.js' index.html
          grep -q 'voltpro-assistant.js' simulator.html
          grep -q 'voltpro-assistant.js' engineering.html
      - name: Validate component registry
        run: node -e "const x=JSON.parse(require('fs').readFileSync('components.json','utf8')); if(x.format!=='voltpro-components'||!Array.isArray(x.library)||x.library.length<100) process.exit(1); console.log('registry entries:',x.library.length)"
      - name: Run regression tests
        run: npm test
      - name: Validate v3 data contracts
        run: node scripts/validate-v3.js
